name: KB tracker and weekly digest
on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours: record what changed in the articles
    - cron: "0 7 * * 1"      # Monday 10:00 Sofia during summer time (UTC+3)
    - cron: "0 8 * * 1"      # Monday 10:00 Sofia during winter time (UTC+2)
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also send the digest email now"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kb-digest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Record article changes
        run: python kb_track.py
      - name: Save snapshots and changes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots changes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KB snapshots"
            git push
          fi
      - name: Send weekly digest (only Monday 10:xx Sofia, or manual run)
        if: github.event_name != 'workflow_dispatch' || inputs.send_email
        run: python kb_digest.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
